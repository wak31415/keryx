# slack_read: "anything waiting for me on Slack?", "what did Sam say about the budget",
# "read me that thread", answered on a call in a few seconds from a handful of reads of
# Slack as you. Changes here count from the next call; no restart.
#
# It is on while reading Slack as you is ticked for a workspace (`keryx auth login
# slack`), whose user token it reads with, and it only ever reads, and only when you ask. What is
# "waiting" is a best effort: direct and group messages whose last word is somebody
# else's, and mentions you have not written after. Listing uses no model at all; these
# two settings are for a question about the messages, answered through the bundled claude
# CLI when it is installed. `keryx plugins remove slack_read` turns this off and leaves
# the workspace as it is, until what is ticked there next changes.

# The model that answers.
model = {model}

# How hard it thinks: low, medium or high. Low keeps the answer to a few seconds, which
# is waited for inside a call.
effort = {effort}
{extra}
