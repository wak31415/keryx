# send_to_slack: "send me that on Slack" posts to your DM, and a PIN lockout is posted there
# too. Changes here count from the next call; no restart.
#
# The bot token is a secret, so it is not in this file: it is SLACK_BOT_TOKEN in
# secrets.toml, set with `keryx config set SLACK_BOT_TOKEN --stdin` (or taken from the
# MCP server below). `keryx plugins remove send_to_slack` turns this off.

# The DM channel it posts to (Slack shows its id in the conversation's details). Blank:
# the SLACK_CHANNEL_ID in the MCP server's config below.
channel_id = {channel_id}

# The user-scope MCP server in ~/.claude.json (in $CLAUDE_CONFIG_DIR, when that is set)
# that gives subagents Slack. Named, subagents are told to use it, and a missing token or
# channel is read from its config. Blank: none.
mcp_server = {mcp_server}
{extra}
