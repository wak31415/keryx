version: 2
updates:
  # `uv` covers `pyproject.toml` + `uv.lock` together, which is what CI installs from
  # (`uv sync --locked`) — a lock left behind by a manifest bump fails the build.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
