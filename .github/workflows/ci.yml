name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch supersedes the first; nothing here is a deployment.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (the tag in a comment), since a tag can be moved under us;
# Dependabot's github-actions updates keep the pins current. No secret is referenced, and
# the trigger is `pull_request`, never `pull_request_target` (#47).
permissions:
  contents: read

jobs:
  test:
    name: lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS carries the wake-word channel (`sounddevice`, `openwakeword`,
        # `onnxruntime` are `sys_platform == 'darwin'` dependencies); Linux runs the
        # phone channel only. Both legs must stay green — the suite is meant to run on a
        # machine with no microphone, and only the Linux leg proves that.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      # Deliberately no configuration is written, here or anywhere in this workflow. The
      # suite must be hermetic: it points HOME and the XDG directories at a temporary
      # directory, and a green run on a runner with no Jarvis settings at all is the
      # standing regression test for the leak in #25.
      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest -q

      # One leg only: the number is the same on both, and a second copy in the summary is
      # noise. `fail_under` in pyproject.toml is what actually fails the build.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run pytest -q --cov --cov-report=term:skip-covered --cov-report=xml
          {
            echo '### Coverage'
            echo
            echo '```'
            uv run coverage report --precision=2 --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: wheel builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Build the sdist and wheel
        run: uv build

      # `prompts/*.md` and `py.typed` are read at runtime, not just packaged for tidiness:
      # a wheel without them installs and then fails on the first call. hatchling's
      # `packages = ["src/jarvis"]` should carry them; verify rather than assume.
      - name: The wheel carries the runtime data files
        run: |
          set -euo pipefail
          contents="$(python -m zipfile -l dist/*.whl)"
          echo "$contents"
          grep -q 'jarvis/py\.typed' <<<"$contents"
          grep -q 'jarvis/prompts/voice_system\.md' <<<"$contents"
          grep -q 'jarvis/prompts/subagent_suffix\.md' <<<"$contents"
          grep -q 'jarvis/prompts/memory_update\.md' <<<"$contents"

      # `uv venv --python 3.12`, not the runner's `python`: `requires-python` is
      # `>=3.12,<3.13`, so a runner image that has moved on to 3.13 would fail the install
      # with "requires a different Python" and say nothing about the wheel. Found by the
      # clean-clone dry run on a host whose system Python is 3.13.
      - name: The wheel installs into a clean venv and the CLI runs
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          # From `/tmp`, so nothing resolves against the checkout.
          cd /tmp && /tmp/wheel-venv/bin/jarvis --help
