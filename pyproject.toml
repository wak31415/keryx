[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis voice agent: Twilio phone + local wake word -> OpenAI Realtime -> Claude Agent SDK subagents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "William Koch", email = "47284092+wak31415@users.noreply.github.com" }]
maintainers = [{ name = "William Koch", email = "47284092+wak31415@users.noreply.github.com" }]
keywords = [
    "voice-agent",
    "telephony",
    "twilio",
    "openai-realtime",
    "claude-agent-sdk",
    "wake-word",
    "speech-to-speech",
]
classifiers = [
    # Not a library: a single-tenant service, installed from a clone. The `Private ::`
    # classifier is the standard hard stop — PyPI rejects any distribution carrying one,
    # so an accidental `uv publish` fails at the index rather than succeeding quietly.
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "twilio",
    "pydantic-settings",
    "numpy",
    "soxr",
    # The wake-word channel is macOS-only: openwakeword 0.6.0 requires tflite-runtime on
    # Linux, whose newest release (2.14.0) has no cp312 wheel. A Linux host therefore runs
    # the phone channel only (`jarvis serve --no-wakeword`); every import of these is lazy.
    "sounddevice; sys_platform == 'darwin'",
    "openwakeword>=0.6.0; sys_platform == 'darwin'",
    "onnxruntime; sys_platform == 'darwin'",
    "claude-agent-sdk",
    "typer",
]

[project.urls]
Homepage = "https://github.com/wak31415/jarvis-voice-agent"
Repository = "https://github.com/wak31415/jarvis-voice-agent"
Issues = "https://github.com/wak31415/jarvis-voice-agent/issues"

[project.scripts]
jarvis = "jarvis.cli:app"

[tool.uv]
# macOS (phone + wake word) and Linux (phone only, see the wake-word note above).
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[dependency-groups]
dev = [
    # Not imported by the tests: starlette's TestClient wants httpx2 and warns (which
    # `filterwarnings = ["error"]` turns into a collection error) when only httpx is there.
    "httpx2>=2.12.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
