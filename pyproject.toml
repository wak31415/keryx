[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis voice agent: Twilio phone + local wake word -> OpenAI Realtime -> Claude Agent SDK subagents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "twilio",
    "pydantic-settings",
    "numpy",
    "sounddevice",
    "soxr",
    "openwakeword>=0.6.0",
    "onnxruntime",
    "claude-agent-sdk",
    "httpx",
    "typer",
]

[project.scripts]
jarvis = "jarvis.cli:app"

[tool.uv]
# macOS-only app (sounddevice + launchd): openwakeword 0.6.0 pulls tflite-runtime on
# Linux, which has no cp312 wheel, so resolve for darwin only.
environments = ["sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
