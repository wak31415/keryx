[project]
name = "keryx-voice"
version = "0.1.0"
description = "Keryx, a voice assistant service: Twilio phone -> OpenAI Realtime -> Claude Agent SDK subagents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "William Koch", email = "47284092+wak31415@users.noreply.github.com" }]
maintainers = [{ name = "William Koch", email = "47284092+wak31415@users.noreply.github.com" }]
keywords = [
    "voice-agent",
    "telephony",
    "twilio",
    "openai-realtime",
    "claude-agent-sdk",
    "speech-to-speech",
]
classifiers = [
    # Not a library: a single-tenant service, installed from a clone. The `Private ::`
    # classifier is the standard hard stop — PyPI rejects any distribution carrying one,
    # so an accidental `uv publish` fails at the index rather than succeeding quietly.
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Every lower bound is the version `uv.lock` pins today — the versions this is actually
# tested against — and every upper bound is the next release that may break us. For a 0.x
# project that is the next *minor*, which is where its breaking changes land.
dependencies = [
    "fastapi>=0.141.1,<1.0",
    "uvicorn[standard]>=0.52.4,<1.0",
    # Majors here retire APIs: the legacy client/server went at 14.
    "websockets>=17.1,<18",
    "twilio>=9.11.0,<10",
    # Starlette parses Twilio's webhook forms with it. It used to arrive only through the
    # Claude Agent SDK (via `mcp`), so an install without the `claude` extra had a phone
    # server that refused every call.
    "python-multipart>=0.0.32,<0.1",
    "pydantic-settings>=2.15.0,<3",
    "numpy>=2.5.2,<3",
    "soxr>=1.1.0,<2",
    "typer>=0.27.2,<1.0",
    # `keryx setup`, the wizard a person walks: rich draws it, questionary asks (select,
    # checkbox, hidden input). Both are imported only by `keryx.setup.ui`, and every test
    # drives the wizard through a scripted prompter instead.
    "rich>=15.0.0,<16",
    "questionary>=2.1.1,<3",
    # Gmail (`check_email`), its sign-in and the setup probes. It used to arrive only through
    # the Claude Agent SDK (via `mcp`), so a Codex-only install could not import the Gmail
    # client at all.
    "httpx>=0.28.1,<1.0",
]

# One extra per coding agent, because each SDK bundles its agent's CLI and they are large:
# install only the agents you will use. `uv sync` in a clone installs `all` anyway (the
# `agents` group below); `pip install keryx-voice` installs neither, so say `keryx-voice[all]`.
[project.optional-dependencies]
claude = [
    # Young and moving fast, and the thing every task runs through. Held to one minor.
    "claude-agent-sdk>=0.2.148,<0.3",
]
codex = [
    # Pinned exactly, not to a minor: the Codex adapter reads the SDK's generated
    # notification types field by field, and the SDK pins its bundled `codex` CLI
    # (openai-codex-cli-bin, ~350 MB installed) to its own version. Move it deliberately,
    # re-recording tests/agents/fixtures/codex_app_*.jsonl.
    "openai-codex==0.158.0",
]
all = ["keryx-voice[claude,codex]"]

[project.urls]
Homepage = "https://github.com/wak31415/keryx"
Repository = "https://github.com/wak31415/keryx"
Issues = "https://github.com/wak31415/keryx/issues"

[project.scripts]
keryx = "keryx.cli:app"
# The old name, for one release: it says what happened and exits, so a unit or a habit
# that still runs `jarvis` is told to run `keryx migrate` rather than "command not found".
jarvis = "keryx.cli:renamed"

[tool.uv]
# macOS and Linux, the two platforms the service installers support.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
default-groups = ["dev", "agents"]

[dependency-groups]
# Every agent, by default: Python packaging has no default extras (PEP 771 is a draft, and
# uv 0.11 has no `default-extras`), so `uv sync` gets them through this default group. For
# fewer, leave the group out and name the extra: `uv sync --no-group agents --extra codex`.
agents = ["keryx-voice[all]"]
dev = [
    # Not imported by the tests: starlette's TestClient wants httpx2 and warns (which
    # `filterwarnings = ["error"]` turns into a collection error) when only httpx is there.
    "httpx2>=2.12.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.0.0,<8",
    # Held to one minor on purpose: ruff adds and changes lint rules between minors, and a
    # release that fails CI on untouched code is a bad way to find that out.
    "ruff>=0.16.5,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keryx"]

[tool.hatch.build.targets.sdist]
# An explicit list rather than "the checkout": `.gitignore` keeps out what it names, but any
# untracked file it does not name — a local `.claude/` full of worktrees, say — would ship.
only-include = [
    "src",
    "tests",
    "docs",
    "ops",
    "scripts",
    "skills",
    ".python-version",
    "CHANGELOG.md",
    "CLAUDE.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/keryx"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# The measured baseline (95.32% on 2026-09-16), floored to a whole point: a rounding
# wobble does not fail CI, real erosion does. It is a ratchet, not a target — raise it
# when the measured number has moved up, never lower it to make a branch pass.
fail_under = 96
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
