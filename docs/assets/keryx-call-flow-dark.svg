<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1800" viewBox="0 0 1360 1800" role="img" aria-labelledby="title description">
<title id="title">One task across three phone calls</title>
<desc id="description">A five-lane sequence diagram. You call Lyra and start a coding-agent task, then hang up. The agent asks which validation split to use; Lyra calls back, relays your answer to the same task, and you hang up again. The agent runs training on a compute cluster. Lyra calls with a short result summary and texts the written report. A result is marked reported only after it is spoken.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
  .title { font-size: 34px; font-weight: 730; fill: #1f2937; }
  .subtitle { font-size: 20px; fill: #526171; }
  .header-box { fill: transparent; stroke: #788796; stroke-width: 1.7; }
  .header-text { font-size: 22px; font-weight: 700; fill: #1f2937; }
  .lifeline { stroke: #9aa8b5; stroke-width: 1.6; stroke-dasharray: 7 8; }
  .message { stroke: #34495e; stroke-width: 2.3; }
  .response { stroke: #617385; stroke-width: 2.3; stroke-dasharray: 8 6; }
  .arrowhead { fill: #34495e; }
  .msg-label { font-size: 21px; font-weight: 640; fill: #1f2937; stroke: #fff; stroke-width: 6; stroke-linejoin: round; paint-order: stroke fill; }
  .msg-detail { font-size: 16px; fill: #526171; stroke: #fff; stroke-width: 5; stroke-linejoin: round; paint-order: stroke fill; }
  .note { fill: transparent; stroke: #9aa8b5; stroke-width: 1.5; }
  .note-heading { font-size: 19px; font-weight: 700; fill: #1f2937; stroke: #fff; stroke-width: 5; paint-order: stroke fill; }
  .note-text { font-size: 17px; fill: #485a6b; stroke: #fff; stroke-width: 5; paint-order: stroke fill; }
  .divider { stroke: #0f766e; stroke-width: 2.1; }
  .phase { font-size: 18px; font-weight: 750; letter-spacing: 1px; fill: #0f766e; stroke: #fff; stroke-width: 10; paint-order: stroke fill; }
  .title, .header-text, .msg-label, .note-heading { fill: #eef2f6; }
  .subtitle, .msg-detail, .note-text { fill: #b7c4d0; }
  .header-box, .note { stroke: #8a98a6; }
  .lifeline { stroke: #748291; }
  .message, .response { stroke: #b7c4d0; }
  .arrowhead { fill: #b7c4d0; }
  .msg-label, .msg-detail, .phase, .note-heading, .note-text { stroke: #0d1117; }
  .phase { fill: #69c7bc; }
  .divider { stroke: #69c7bc; }
</style>
<text class="title" x="55" y="48">One task, three calls</text>
<text class="subtitle" x="55" y="83">Start a sweep · answer one question · hear the result</text>
<rect class="header-box" x="17" y="112" width="206" height="52" rx="6"/>
<text class="header-text" x="120" y="146" text-anchor="middle">You</text>
<line class="lifeline" x1="120" y1="164" x2="120" y2="1726"/>
<rect class="header-box" x="292" y="112" width="206" height="52" rx="6"/>
<text class="header-text" x="395" y="146" text-anchor="middle">Twilio</text>
<line class="lifeline" x1="395" y1="164" x2="395" y2="1726"/>
<rect class="header-box" x="577" y="112" width="206" height="52" rx="6"/>
<text class="header-text" x="680" y="146" text-anchor="middle">Lyra</text>
<line class="lifeline" x1="680" y1="164" x2="680" y2="1726"/>
<rect class="header-box" x="862" y="112" width="206" height="52" rx="6"/>
<text class="header-text" x="965" y="146" text-anchor="middle">Coding agent</text>
<line class="lifeline" x1="965" y1="164" x2="965" y2="1726"/>
<rect class="header-box" x="1137" y="112" width="206" height="52" rx="6"/>
<text class="header-text" x="1240" y="146" text-anchor="middle">Compute cluster</text>
<line class="lifeline" x1="1240" y1="164" x2="1240" y2="1726"/>
<line class="divider" x1="55" y1="202" x2="1305" y2="202"/>
<text class="phase" x="680" y="207" text-anchor="middle">CALL 1 · START THE TASK</text>
<line class="message" x1="120" y1="275" x2="384" y2="275"/>
<polygon class="arrowhead" points="395,275 383,268 383,282"/>
<text class="msg-label" x="257" y="235" text-anchor="middle">Dial Lyra</text>
<text class="msg-detail" x="257" y="256" text-anchor="middle">phone or calling watch</text>
<line class="message" x1="395" y1="337" x2="669" y2="337"/>
<polygon class="arrowhead" points="680,337 668,330 668,344"/>
<text class="msg-label" x="537" y="297" text-anchor="middle">Incoming call</text>
<text class="msg-detail" x="537" y="318" text-anchor="middle">signed webhook · caller checked</text>
<line class="response" x1="680" y1="399" x2="406" y2="399"/>
<polygon class="arrowhead" points="395,399 407,392 407,406"/>
<text class="msg-label" x="537" y="359" text-anchor="middle">Accept call</text>
<text class="msg-detail" x="537" y="380" text-anchor="middle">TwiML · one-time stream token</text>
<line class="message" x1="395" y1="461" x2="669" y2="461"/>
<polygon class="arrowhead" points="680,461 668,454 668,468"/>
<text class="msg-label" x="537" y="421" text-anchor="middle">Audio stream opens</text>
<text class="msg-detail" x="537" y="442" text-anchor="middle">µ-law · 8 kHz</text>
<rect class="note" x="112" y="488" width="630" height="68" rx="7"/>
<text class="note-heading" x="135" y="515">PIN before dispatch</text>
<text class="note-text" x="135" y="540">Spoken or keyed; keypad digits stay out of the transcript.</text>
<line class="message" x1="120" y1="623" x2="669" y2="623"/>
<polygon class="arrowhead" points="680,623 668,616 668,630"/>
<text class="msg-label" x="400" y="583" text-anchor="middle">Run a learning-rate sweep</text>
<text class="msg-detail" x="400" y="604" text-anchor="middle">microscopy images · call with questions and results</text>
<line class="message" x1="680" y1="685" x2="954" y2="685"/>
<polygon class="arrowhead" points="965,685 953,678 953,692"/>
<text class="msg-label" x="822" y="645" text-anchor="middle">Dispatch task 12</text>
<text class="msg-detail" x="822" y="666" text-anchor="middle">coding agent works on your machine</text>
<line class="response" x1="680" y1="747" x2="131" y2="747"/>
<polygon class="arrowhead" points="120,747 132,740 132,754"/>
<text class="msg-label" x="400" y="707" text-anchor="middle">Task 12 started</text>
<line class="message" x1="120" y1="809" x2="384" y2="809"/>
<polygon class="arrowhead" points="395,809 383,802 383,816"/>
<text class="msg-label" x="257" y="769" text-anchor="middle">Hang up</text>
<line class="divider" x1="55" y1="845" x2="1305" y2="845"/>
<text class="phase" x="680" y="850" text-anchor="middle">FIRST CALLBACK · ANSWER A QUESTION</text>
<line class="response" x1="965" y1="920" x2="691" y2="920"/>
<polygon class="arrowhead" points="680,920 692,913 692,927"/>
<text class="msg-label" x="822" y="880" text-anchor="middle">Decision needed</text>
<text class="msg-detail" x="822" y="901" text-anchor="middle">the agent needs your choice</text>
<line class="message" x1="680" y1="982" x2="406" y2="982"/>
<polygon class="arrowhead" points="395,982 407,975 407,989"/>
<text class="msg-label" x="537" y="942" text-anchor="middle">Call you back</text>
<text class="msg-detail" x="537" y="963" text-anchor="middle">question in opening context</text>
<line class="response" x1="395" y1="1044" x2="131" y2="1044"/>
<polygon class="arrowhead" points="120,1044 132,1037 132,1051"/>
<text class="msg-label" x="257" y="1004" text-anchor="middle">Which validation split?</text>
<text class="msg-detail" x="257" y="1025" text-anchor="middle">By patient, or by individual image?</text>
<line class="message" x1="120" y1="1106" x2="669" y2="1106"/>
<polygon class="arrowhead" points="680,1106 668,1099 668,1113"/>
<text class="msg-label" x="400" y="1066" text-anchor="middle">Use the patient split</text>
<line class="message" x1="680" y1="1168" x2="954" y2="1168"/>
<polygon class="arrowhead" points="965,1168 953,1161 953,1175"/>
<text class="msg-label" x="822" y="1128" text-anchor="middle">Send follow-up to task 12</text>
<text class="msg-detail" x="822" y="1149" text-anchor="middle">same coding-agent session</text>
<line class="message" x1="120" y1="1230" x2="384" y2="1230"/>
<polygon class="arrowhead" points="395,1230 383,1223 383,1237"/>
<text class="msg-label" x="257" y="1190" text-anchor="middle">Hang up</text>
<line class="divider" x1="55" y1="1266" x2="1305" y2="1266"/>
<text class="phase" x="680" y="1271" text-anchor="middle">TASK RESUMES · FINAL CALLBACK</text>
<line class="message" x1="965" y1="1341" x2="1229" y2="1341"/>
<polygon class="arrowhead" points="1240,1341 1228,1334 1228,1348"/>
<text class="msg-label" x="1102" y="1301" text-anchor="middle">Submit the sweep</text>
<text class="msg-detail" x="1102" y="1322" text-anchor="middle">cluster skill · guarded SSH · sbatch</text>
<line class="response" x1="1240" y1="1403" x2="976" y2="1403"/>
<polygon class="arrowhead" points="965,1403 977,1396 977,1410"/>
<text class="msg-label" x="1102" y="1363" text-anchor="middle">Training finished</text>
<text class="msg-detail" x="1102" y="1384" text-anchor="middle">two GPUs · results collected</text>
<line class="response" x1="965" y1="1465" x2="691" y2="1465"/>
<polygon class="arrowhead" points="680,1465 692,1458 692,1472"/>
<text class="msg-label" x="822" y="1425" text-anchor="middle">Summary + written report</text>
<text class="msg-detail" x="822" y="1446" text-anchor="middle">best run beats baseline by six points</text>
<line class="response" x1="680" y1="1527" x2="131" y2="1527"/>
<polygon class="arrowhead" points="120,1527 132,1520 132,1534"/>
<text class="msg-label" x="400" y="1487" text-anchor="middle">Text the report link</text>
<line class="message" x1="680" y1="1589" x2="406" y2="1589"/>
<polygon class="arrowhead" points="395,1589 407,1582 407,1596"/>
<text class="msg-label" x="537" y="1549" text-anchor="middle">Final callback</text>
<text class="msg-detail" x="537" y="1570" text-anchor="middle">result in opening context</text>
<line class="response" x1="395" y1="1651" x2="131" y2="1651"/>
<polygon class="arrowhead" points="120,1651 132,1644 132,1658"/>
<text class="msg-label" x="257" y="1611" text-anchor="middle">Best run: 82% accuracy</text>
<text class="msg-detail" x="257" y="1632" text-anchor="middle">up from 76% on the patient split</text>
<path class="message" d="M680 1686 H750 V1715 H692" fill="none"/>
<polygon class="arrowhead" points="680,1715 692,1708 692,1722"/>
<text class="msg-label" x="790" y="1689">Mark reported</text>
<text class="msg-detail" x="790" y="1712">only after spoken</text>
<rect class="note" x="178" y="1738" width="1004" height="47" rx="7"/>
<text class="note-text" x="680" y="1768" text-anchor="middle">Already on a call? Lyra speaks there. Otherwise, the result waits in your next-call digest.</text>
</svg>
